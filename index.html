<!doctype html>
<html lang="ru" class="no-js">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Алексей Барковский — психолог и лектор</title>
  <meta name="description" content="Психолог, который называет вещи своими именами. Лекции без воды и эзотерики: о смыслах, трудностях и умении быть услышанным. Пригласить спикером на мероприятие.">
  <meta name="theme-color" content="#050505">
  <meta name="color-scheme" content="dark">

  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">

  <link rel="preload" href="assets/fonts/coolvetica-compressed-heavy.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/inter-cyrillic.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/css/style.css">

  <script>document.documentElement.classList.replace('no-js', 'js');</script>
</head>
<body>

  <!-- ===================== ШАПКА ===================== -->
  <header class="header">
    <div class="container header__inner">
      <a class="header__logo" href="#top" aria-label="BARK — наверх">
        <span class="mark mark--cat-face" aria-hidden="true"></span>
        <span class="mark mark--bark" aria-hidden="true"></span>
      </a>
      <nav class="header__nav" aria-label="Разделы сайта">
        <a href="#about">Обо мне</a>
        <a href="#lectures">Лекции</a>
        <a href="#video">Видео</a>
        <a href="#formats">Форматы</a>
        <a href="#soon">Книга</a>
        <a href="#contacts">Контакты</a>
      </nav>
      <a class="btn btn--primary btn--small" href="https://t.me/barkotey" data-invite>Пригласить</a>
    </div>
  </header>

  <main id="top">

    <!-- ===================== 1. ПЕРВЫЙ ЭКРАН ===================== -->
    <section class="hero" aria-label="Алексей Барковский">
      <div class="hero__photo">
        <img
          src="assets/img/hero-800.jpg"
          srcset="assets/img/hero-800.jpg 800w, assets/img/hero-1400.jpg 1400w"
          sizes="(min-width: 960px) 50vw, 100vw"
          width="800" height="1199"
          alt="Алексей Барковский, психолог и лектор"
          fetchpriority="high">
      </div>
      <span class="hero__cat mark mark--cat-profile" aria-hidden="true"></span>

      <div class="container hero__content">
        <p class="hero__roles intro">Психолог · Лектор · Коуч</p>
        <h1 class="hero__name title intro" style="--delay: .1s">Алексей<br>Барковский</h1>
        <p class="hero__tagline lead intro" style="--delay: .2s">Психолог, который называет вещи <span class="accent">своими именами</span></p>
        <p class="hero__sub muted intro" style="--delay: .3s">Лекции без воды, эзотерики и «просто полюби себя». Только то, что можно применить завтра утром.</p>
        <div class="hero__actions intro" style="--delay: .4s">
          <a class="btn btn--primary" href="https://t.me/barkotey" data-invite>Пригласить спикером</a>
          <a class="btn btn--ghost" href="#lectures">Темы лекций</a>
        </div>
      </div>
    </section>

  </main>

  <script src="assets/js/main.js" defer></script>
</body>
</html>
